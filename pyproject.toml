[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artl-memory"
version = "0.4.0"
description = "The multi-person memory layer for agents: verbatim utterances, per-person isolation, evidence chain, confidence. It remembers everyone in the room — separately."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ARTL family" },
]
keywords = ["agent", "memory", "multi-person", "evidence-chain", "local-first", "sqlite"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

# 零硬依赖：sqlite3 是标准库。这是刻意的——记忆层不该拖着一堆包进门。
dependencies = []

[project.optional-dependencies]
# 可选语义召回：本地小模型（bge-small-zh）或任何 embedding API，
# 接进 MemoryService(recall_scorer=...)。不装就是纯零依赖。
semantic = ["fastembed>=0.4"]

[project.urls]
Homepage = "https://github.com/boboodod1977/artl-memory"

[tool.setuptools.packages.find]
include = ["artl_memory*"]

[tool.setuptools.package-data]
artl_memory = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.mypy]
python_version = "3.11"
packages = ["artl_memory"]
ignore_missing_imports = true
check_untyped_defs = true

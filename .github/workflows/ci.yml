name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # 双后端一致性 + 对抗性测试 + 回归钉死 + 示例能跑，四道门
      - run: python tests/test_conformance.py
      - run: python tests/test_adversarial.py
      - run: python tests/test_regressions.py
      - run: python examples/two_people.py
      # 演示脚本必须真能跑通——README 的 GIF 是它录的，不是摆拍
      - run: python examples/meeting_demo.py --fast
      # MCP 挂件：装上可选依赖再测协议层（含真 stdio 握手）
      - run: |
          python -m pip install ".[mcp]"
          python tests/test_mcp_server.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
